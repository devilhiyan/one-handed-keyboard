[Settings]
ShowOutputKeys=0
StickyHoldEnabled=1

[Driver]
; Options: auto | winIOv2 | wintercept
; - auto: automatically detects if Interception driver is installed; falls back to winIOv2
; - winIOv2: forces modern LLHOOK + SendInput (ideal for Windows 11 24H2 & desktop PCs)
; - wintercept: forces Interception kernel filter driver (for legacy laptops)
Mode=auto

[NVDA]
; CustomPath: leave empty to use default installation (C:\Program Files\NVDA)
CustomPath=
